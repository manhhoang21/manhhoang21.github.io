<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
<meta charset="UTF-8" />
<script>
// Chạy trước khi vẽ trang: bật hiệu ứng hiện dần, và áp chế độ sáng/tối người đọc đã chọn
// (không có thì theo hệ điều hành). Nút đổi chế độ nằm ở _includes/nav.html.
(function () {
  var root = document.documentElement;
  root.classList.add('js-anim');
  try {
    var theme = localStorage.getItem('theme');
    if (theme === 'light' || theme === 'dark') root.setAttribute('data-theme', theme);
  } catch (e) {}
})();
</script>
<meta name="color-scheme" content="light dark" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="shortcut icon" href="{{ '/logo.ico' | relative_url }}" type="image/x-icon" />
<link rel="stylesheet" href="{{ '/style.css' | relative_url }}" />
<title>{% if page.nav == 'home' %}{{ site.title }}{% else %}{{ page.title }} — {{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace }}" />
</head>
<body class="{{ page.body_class | default: '' }}">

{% include nav.html %}

{{ content }}

<footer>
  <p>© {{ site.time | date: "%Y" }} {{ site.author }}.</p>
</footer>

{% include hien-dan.html %}

</body>
</html>
