<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
<meta charset="UTF-8" />
<script>
// Chạy trước khi vẽ trang để không nháy màu/hiệu ứng sai:
// - js: có JS (hiện nút Thiết lập), js-anim: bật hiệu ứng hiện dần
// - áp lựa chọn người xem đã lưu: data-theme (light|dark),
//   data-motion (reduce = Tắt | medium = Vừa | full = Đầy đủ).
//   Không có, không đọc được, hoặc giá trị lạ -> theo hệ điều hành.
// Bảng Thiết lập nằm ở _includes/nav.html.
(function () {
  var root = document.documentElement;
  root.classList.add('js', 'js-anim');
  try {
    var theme = localStorage.getItem('theme');
    if (theme === 'light' || theme === 'dark') root.setAttribute('data-theme', theme);
    var motion = localStorage.getItem('motion');
    if (motion === 'full' || motion === 'medium' || motion === 'reduce') root.setAttribute('data-motion', motion);
  } catch (e) {}
})();
</script>
<meta name="color-scheme" content="light dark" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="shortcut icon" href="{{ '/logo.ico' | relative_url }}" type="image/x-icon" />
<link rel="stylesheet" href="{{ '/style.css' | relative_url }}" />
<title>{% if page.nav == 'home' %}{{ site.title }}{% else %}{{ page.title }} — {{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace }}" />
</head>
<body class="{{ page.body_class | default: '' }}">

{% include nav.html %}

{{ content }}

<footer>
  <p>© {{ site.time | date: "%Y" }} {{ site.author }}.</p>
</footer>

{% include hien-dan.html %}

</body>
</html>
