title: Trịnh Mạnh Hoàng
description: Lập trình viên Java. Ghi chép về nghề, và thỉnh thoảng về chuyện ngoài công việc.
author: Trịnh Mạnh Hoàng
lang: vi

url: https://manhhoang21.github.io
baseurl: ""

# Repo ảnh riêng, serve qua jsDelivr CDN.
# Ghim theo mã commit của blog-anh, KHÔNG dùng @main: jsDelivr cho trình duyệt giữ ảnh 7 ngày,
# nên nếu ảnh đổi nội dung mà giữ tên thì người đã xem bài sẽ thấy ảnh cũ. Ghim commit thì
# mỗi lần ảnh đổi, địa chỉ ảnh đổi theo.
# Mỗi lần push ảnh mới/sửa ảnh lên blog-anh: thay mã dưới bằng commit mới nhất của blog-anh
# (cd D:\Project\blog-anh && git rev-parse HEAD). Quên thì CI báo "Không tìm thấy ảnh".
cdn_url: "https://cdn.jsdelivr.net/gh/manhhoang21/blog-anh@c4ec36569fc1f0f10a5d359ffda927533dc3dc76"

# Bài viết ra URL dạng /bai-viet/ten-bai/
permalink: /bai-viet/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

  # Trải nghiệm: thả bài vào đúng thư mục là tự có danh mục, layout và URL.
  # Không cần ghi category/layout/permalink trong bài. Mẫu bài ở _drafts/mau-*.md
  - scope:
      path: "_posts/du-lich"
      type: posts
    values:
      category: duong
      layout: trai-nghiem
      nav: experience
      permalink: /trai-nghiem/du-lich/:title/
  - scope:
      path: "_posts/am-thuc"
      type: posts
    values:
      category: an
      layout: trai-nghiem
      nav: experience
      permalink: /trai-nghiem/am-thuc/:title/
  - scope:
      path: "_posts/vui-choi"
      type: posts
    values:
      category: choi
      layout: trai-nghiem
      nav: experience
      permalink: /trai-nghiem/vui-choi/:title/

# Không đẩy mấy file này lên web
exclude:
  - ke-hoach-noi-dung-blog.md
  - milestone.md
  - review.md
  - Gemfile
  - Gemfile.lock
  - README.md
  - scripts/
  - vendor/   # gem do bundler cài trong CI (.github/workflows/kiem-tra.yml)
